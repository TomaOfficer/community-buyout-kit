name: Kit checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check downloadable kit
        run: |
          {
            sed '1,/^---$/d' skills/community-buyout/SKILL.md
            printf '\n## License\n\n'
            cat LICENSE
          } | diff -u community-buyout-kit.md -
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - name: Check skill metadata and local links
        run: npm run check:kit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke-test the 99 Union Square brief
        run: npm run check:brief
